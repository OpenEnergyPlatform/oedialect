[bumpversion]
current_version = 0.1.2

[egg_info]
tag_build = 

[tool:pytest]
addopts = --tb native -v -r fxX --maxfail=25 -p no:warnings
python_files = test/*test_*.py

[sqla_testing]
requirement_cls = oedialect.requirements:Requirements
profile_file = test/profiles.txt

[db]
default = postgres+oedialect://user:token@localhost:8000
